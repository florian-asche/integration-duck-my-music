version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    commit-message:
      prefix: ""
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    commit-message:
      prefix: ""
    cooldown:
      default-days: 3
